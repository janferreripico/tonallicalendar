<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  color-scheme:light;
  /* direction palettes: oriente rojo, norte negro, poniente blanco, sur azul */
  --bg-0:#A3123A; --ink-0:#F6E9DA; --soft-0:rgba(246,233,218,.62); --line-0:rgba(246,233,218,.28);
  --bg-1:#1F1B19; --ink-1:#EADFCB; --soft-1:rgba(234,223,203,.58); --line-1:rgba(234,223,203,.22);
  --bg-2:#E8E5DD; --ink-2:#2B2420; --soft-2:rgba(43,36,32,.6);   --line-2:rgba(43,36,32,.2);
  --bg-3:#2A7B95; --ink-3:#F1F4EF; --soft-3:rgba(241,244,239,.66); --line-3:rgba(241,244,239,.3);
  --display:"Gloock", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --text:"Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg-0:#56091F; --ink-0:#F1DFCF; --soft-0:rgba(241,223,207,.58); --line-0:rgba(241,223,207,.22);
    --bg-1:#141110; --ink-1:#E2D6C1; --soft-1:rgba(226,214,193,.55); --line-1:rgba(226,214,193,.18);
    --bg-2:#4B4741; --ink-2:#F2EEE6; --soft-2:rgba(242,238,230,.6); --line-2:rgba(242,238,230,.22);
    --bg-3:#16485A; --ink-3:#E7EFEE; --soft-3:rgba(231,239,238,.6); --line-3:rgba(231,239,238,.22);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-0:#56091F; --ink-0:#F1DFCF; --soft-0:rgba(241,223,207,.58); --line-0:rgba(241,223,207,.22);
  --bg-1:#141110; --ink-1:#E2D6C1; --soft-1:rgba(226,214,193,.55); --line-1:rgba(226,214,193,.18);
  --bg-2:#4B4741; --ink-2:#F2EEE6; --soft-2:rgba(242,238,230,.6); --line-2:rgba(242,238,230,.22);
  --bg-3:#16485A; --ink-3:#E7EFEE; --soft-3:rgba(231,239,238,.6); --line-3:rgba(231,239,238,.22);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg-0);transition:background-color .5s ease}
*,*::before,*::after{box-sizing:inherit}
body{
  --bg:var(--bg-0); --ink:var(--ink-0); --soft:var(--soft-0); --line:var(--line-0);
  margin:0; background:var(--bg); color:var(--ink);
  /* fixed to the real screen edges: iOS home-screen apps report a viewport shorter than the screen */
  position:fixed; inset:0; bottom:calc(-1 * var(--vfix, 0px));  /* bottom: sit in the lower part of the home-indicator zone, like iOS 26 floating bars, not above it */
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) max(calc(env(safe-area-inset-bottom,0px) - 16px), 12px) env(safe-area-inset-left,0px);
  font-family:var(--text); -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  transition:background-color .5s ease, color .5s ease;
  overscroll-behavior:none; touch-action:pan-y; user-select:none; -webkit-user-select:none;
  overflow:hidden;
}
body[data-dir="1"]{--bg:var(--bg-1);--ink:var(--ink-1);--soft:var(--soft-1);--line:var(--line-1)}
body[data-dir="2"]{--bg:var(--bg-2);--ink:var(--ink-2);--soft:var(--soft-2);--line:var(--line-2)}
body[data-dir="3"]{--bg:var(--bg-3);--ink:var(--ink-3);--soft:var(--soft-3);--line:var(--line-3)}

/* Every block has a fixed size, so nothing moves when the day changes */
main{
  height:100%; width:100%; max-width:480px; margin:0 auto; padding:16px 24px 0; container-type:size;
  display:grid; grid-template-rows:44px 1fr 112px 60px; text-align:center;
}
.gdate{position:relative; justify-self:center; align-self:center; height:36px; line-height:36px;
  font-size:15px; color:var(--soft); padding:0 14px; border-radius:18px; white-space:nowrap}
.gdate input{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; font-size:16px}
.gdate:focus-within{outline:2px solid var(--ink)}

.day{align-self:center; display:grid; justify-items:center; row-gap:16px;
  --gw:max(120px, min(68cqw, 300px, calc((100cqh - 385px) * .909)))}
.day .txt{display:grid; justify-items:center; justify-self:stretch; min-width:0; row-gap:6px; transition:opacity .2s ease}
.day.out .txt{opacity:0}
.cart{width:var(--gw); aspect-ratio:240/264; display:block; overflow:visible; filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cart{filter:brightness(.9) drop-shadow(0 6px 14px rgba(0,0,0,.4))} }
:root[data-theme="dark"] .cart{filter:brightness(.9)}
/* entrance: the frame draws itself, corners bloom, the figure arrives, the dots are counted */
.cart .band{stroke-dasharray:1000; stroke-dashoffset:1000; animation:draw .9s cubic-bezier(.6,0,.2,1) forwards}
.cart .corner{transform-box:fill-box; transform-origin:center; transform:scale(0); animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.cart .fig{transform-box:view-box; transform-origin:100px 100px; opacity:0; animation:arrive .8s cubic-bezier(.2,.9,.3,1.15) .15s forwards}
.cart .dot{transform-box:fill-box; transform-origin:center; transform:scale(0); animation:pop .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes arrive{from{opacity:0; transform:scale(.7) rotate(-8deg)} to{opacity:1; transform:none}}

.sign{
  font-family:var(--display); font-weight:400; margin:0; white-space:nowrap;
  font-size:var(--fs); line-height:1.1; height:1.1em; --fs:clamp(36px, 11.6vw, 64px);
}
.reading{font-size:16px; line-height:28px; height:56px; color:var(--soft); margin:0}
.reading i{font-style:italic}

.glyph .thin{stroke-width:2.2} .glyph .ns{stroke:none}
.glyph [class*="a-"]{transform-box:view-box;transform-origin:var(--o,100px 100px);animation-duration:var(--t,4s);animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.a-blink{animation-name:blink;--t:5.5s} @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.a-sway{animation-name:sway} @keyframes sway{0%,100%{transform:rotate(calc(var(--a,4deg)*-1))}50%{transform:rotate(var(--a,4deg))}}
.a-osc{animation-name:sway;--a:7deg}
.a-twitch{animation-name:twitch} @keyframes twitch{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(var(--a,-10deg))}86%{transform:rotate(0)}90%{transform:rotate(var(--a,-10deg))}94%{transform:rotate(0)}}
.a-flick{animation-name:flick} @keyframes flick{0%,64%,100%{transform:scaleX(0)}70%,84%{transform:scaleX(1)}}
.a-drift{animation-name:drift;animation-timing-function:ease-out} @keyframes drift{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx,20px),var(--dy,-10px)) scale(1.1);opacity:0}}
.a-fall{animation-name:fall;animation-timing-function:ease-in} @keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}75%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.a-flow{stroke-dasharray:14 10;animation-name:flow;animation-timing-function:linear;--t:1.6s} @keyframes flow{to{stroke-dashoffset:-48}}
.a-bob{animation-name:bob} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--y,-4px))}}
.a-pulse{animation-name:pulse;--t:3s} @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.a-chatter{animation-name:chatter;--t:3.5s} @keyframes chatter{0%,70%,100%{transform:rotate(0)}74%,82%{transform:rotate(7deg)}78%,86%{transform:rotate(0)}}
.a-pant{animation-name:pant} @keyframes pant{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.75)}}
.a-bloom{animation-name:bloom} @keyframes bloom{0%,100%{transform:scale(.94) rotate(-4deg)}50%{transform:scale(1.04) rotate(4deg)}}
.a-shine{animation-name:shine;--t:4.5s;transform-origin:100px 100px} @keyframes shine{0%,55%{transform:rotate(35deg) translateX(0)}85%,100%{transform:rotate(35deg) translateX(260px)}}
.a-breathe{animation-name:breathe} @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
.a-peck{animation-name:peck} @keyframes peck{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(7deg)}76%{transform:rotate(-2deg)}84%{transform:rotate(0)}}
/* ---------- controls: iOS-like glass buttons ---------- */
:root{--sys:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Instrument Sans", system-ui, sans-serif}
body{--glass:color-mix(in srgb, var(--ink) 13%, transparent); --glass-on:color-mix(in srgb, var(--ink) 24%, transparent)}
main{grid-template-rows:52px 1fr 104px 52px; grid-template-columns:minmax(0,1fr)}
nav{align-items:end}
.top{display:grid; grid-template-columns:minmax(0,1fr) 44px; column-gap:12px; align-items:center}
.top .gdate{justify-self:start; max-width:100%; overflow:hidden; text-overflow:ellipsis; padding:0 8px 0 2px; margin-left:-2px}
.gdate{font-family:var(--sys)}
.round,.pill{
  -webkit-appearance:none; appearance:none; border:0; margin:0; cursor:pointer; color:var(--ink);
  background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  display:inline-grid; place-items:center; -webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.3,.7,.4,1.4), background-color .2s ease, opacity .2s ease;
}
.round{width:44px; height:44px; border-radius:50%; padding:0}
.pill{height:44px; border-radius:22px; padding:0 22px; font:600 16px/1 var(--sys); letter-spacing:-.01em}
.round:active,.pill:active{transform:scale(.9); background:var(--glass-on)}
.round:focus-visible,.pill:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.round svg{width:20px; height:20px; display:block}
.round[aria-expanded="true"]{background:var(--glass-on)}
nav{display:grid; grid-template-columns:48px 1fr 48px; align-items:center}
nav .round{width:48px; height:48px}
nav .pill{justify-self:center; transition:transform .18s cubic-bezier(.3,.7,.4,1.4), opacity .25s ease}
nav .pill.hide{opacity:0; transform:scale(.8); pointer-events:none}

.ticks{display:flex; gap:5px; height:12px; align-items:center}
.ticks span{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line)}
.ticks span.past{background:var(--line); border-color:transparent}
.ticks span.now{background:var(--ink); border-color:var(--ink)}
/* veintena & year: two labelled values over a 20-segment band */
.month{
  -webkit-appearance:none; appearance:none; font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;
  margin:0; width:100%; border:0; border-top:1px solid var(--line); border-radius:0; background:none; padding:16px 2px 0;
  display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:16px; row-gap:14px; align-self:start; align-content:start;
  text-align:left; transition:opacity .15s ease;
}
.month:active{opacity:.55}
.month .col{display:grid; row-gap:3px; min-width:0}
.month .r{text-align:right}
.month .cap{font:600 11px/14px var(--sys); letter-spacing:.08em; text-transform:uppercase; color:var(--soft)}
.month .val{font-size:15px; line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--soft)}
.month .val b{font-family:var(--display); font-weight:400; font-size:21px; color:var(--ink); margin-right:6px}
.band{grid-column:1 / -1; display:flex; column-gap:3px; height:14px; align-items:center}
.band span{flex:1 1 0; height:5px; border-radius:2px; background:var(--line); transition:height .3s ease}
.band span:nth-child(5n):not(:last-child){margin-right:5px}
.band span.past{background:color-mix(in srgb, var(--ink) 45%, transparent)}
.band span.now{height:14px; background:var(--ink)}
.month:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.month p{margin:0; font-size:16px; line-height:22px; white-space:nowrap}
.month b{font-weight:600}
.month .ticks{justify-content:flex-start; gap:4px} .month .ticks span{width:8px; height:8px}
.month .year{font-size:14px; line-height:20px; color:var(--soft)}
.month .chev{grid-column:2; grid-row:1 / 4; align-self:center; width:20px; height:20px; opacity:.6}

/* ---------- iOS menu ---------- */
.menu-layer{position:fixed; inset:0; z-index:20}
.menu-layer[hidden]{display:none}
.menu{
  position:fixed; width:min(270px, calc(100vw - 32px)); border-radius:14px; overflow:hidden;
  background:rgba(242,242,247,.8); color:#000; font-family:var(--sys);
  -webkit-backdrop-filter:blur(30px) saturate(1.8); backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:0 12px 40px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.08);
  transform:scale(.25); opacity:0; transition:transform .32s cubic-bezier(.25,1.25,.4,1), opacity .18s ease;
}
.menu.open{transform:scale(1); opacity:1}
.menu button{
  -webkit-appearance:none; appearance:none; border:0; background:none; color:inherit; font:inherit; cursor:pointer; width:100%;
  display:grid; grid-template-columns:22px 1fr 24px; align-items:center; column-gap:8px; padding:11px 16px 11px 12px; text-align:left;
  -webkit-tap-highlight-color:transparent;
}
.menu button:active{background:rgba(0,0,0,.08)} .menu button:focus-visible{outline:2px solid #0a84ff; outline-offset:-2px}
.menu .ck{width:16px; height:16px; visibility:hidden} .menu [aria-checked="true"] .ck{visibility:visible}
.menu b{display:block; font-weight:400; font-size:17px; line-height:22px; letter-spacing:-.02em}
.menu small{display:block; font-size:13px; line-height:18px; color:rgba(60,60,67,.6)}
.menu .ico{width:22px; height:22px}
.menu hr{margin:0 0 0 42px; border:0; border-top:.5px solid rgba(60,60,67,.29)}
.menu .title{font-size:13px; line-height:18px; color:rgba(60,60,67,.6); padding:10px 16px 8px; text-align:center; border-bottom:.5px solid rgba(60,60,67,.29)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .menu{background:rgba(37,37,40,.8); color:#fff; box-shadow:0 12px 40px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08)}
  :root:not([data-theme="light"]) .menu small,:root:not([data-theme="light"]) .menu .title{color:rgba(235,235,245,.6)}
  :root:not([data-theme="light"]) .menu hr,:root:not([data-theme="light"]) .menu .title{border-color:rgba(84,84,88,.6)}
  :root:not([data-theme="light"]) .menu button:active{background:rgba(255,255,255,.1)}
}

/* ---------- iOS sheet with the calendar ---------- */
.dim{position:fixed; inset:0; bottom:calc(-1 * var(--vfix, 0px)); z-index:5; background:rgba(0,0,0,.4); opacity:0; transition:opacity .35s ease}
.dim.open{opacity:1} .dim[hidden]{display:none}
.sheet{
  position:fixed; z-index:6; left:0; right:0; bottom:calc(-1 * var(--vfix, 0px)); margin:0 auto; max-width:520px;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  background:var(--bg); color:var(--ink); border-radius:14px 14px 0 0; box-shadow:0 -4px 30px rgba(0,0,0,.25);
  padding:8px 16px 0;
  display:grid; grid-template-rows:12px 52px auto minmax(0,1fr);
  transform:translateY(105%); transition:transform .42s cubic-bezier(.2,.9,.25,1);
}
.sheet.open{transform:none} .sheet:focus{outline:none} .sheet[hidden]{display:none} .sheet.drag{transition:none}
.grab{justify-self:center; width:36px; height:5px; border-radius:3px; background:var(--line); margin-top:2px}
.sbar{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; text-align:center; touch-action:none}
.sbar span{font:600 17px/22px var(--sys); letter-spacing:-.02em}
.wk{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; font:600 12px/24px var(--sys); color:var(--soft); text-align:center; text-transform:uppercase}
.wk[hidden]{display:none}
.scroller{position:relative; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px calc(env(safe-area-inset-bottom,0px) + 92px)}
.period{padding:18px 0 10px}
.period h3{margin:0; font-family:var(--display); font-weight:400; font-size:24px; line-height:30px}
.period h3 span{color:var(--soft)}
.period.now h3{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:6px}
.period p{margin:0 0 10px; font-size:14px; line-height:20px; color:var(--soft)}
.sheet[data-view="m"] .period h3{font-size:22px}
.wk{border-bottom:1px solid var(--line); padding-bottom:4px}
.grid{display:grid; gap:6px; align-content:start; padding:4px 3px 6px}
.grid.v{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.m{grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
.cell{-webkit-appearance:none; appearance:none; border:0; margin:0; font:inherit; cursor:pointer; position:relative;
  background:#F1E7D0; color:#2a1d17; border-radius:10px; padding:4px 2px 6px; display:grid; justify-items:center; -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease}
.cell:active{transform:scale(.94)}
.cell svg{width:100%; aspect-ratio:1; display:block}
.grid.v .cell{grid-template-rows:auto 18px 16px}
.grid.v .cell svg{max-width:64px}
.cell .n{font-size:12px; line-height:18px; font-weight:500; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em}
.cell .g{font-size:11px; line-height:16px; opacity:.65}
.cell .num{position:absolute; top:4px; left:6px; font-size:12px; font-weight:500; line-height:16px}
.grid.m .cell{grid-template-rows:20px auto; padding:3px 2px 4px; border-radius:9px}
.grid.m .cell .d{font:600 15px/20px var(--sys)}
.grid.m .cell .mx{position:absolute; bottom:2px; right:4px; font-size:10px; line-height:12px; font-weight:600; opacity:.7}
.grid.m .blank{visibility:hidden}
.cell.today{box-shadow:0 0 0 3px var(--ink)}
.cell.sel{box-shadow:0 0 0 2.5px var(--bg), 0 0 0 5px var(--ink)}
.cell.today.sel{box-shadow:0 0 0 3px var(--ink)}
/* floating "Avui" over the scroll, frosted */
.sfoot{position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); display:grid; place-items:center; pointer-events:none}
.sfoot .pill{
  pointer-events:auto; height:48px; padding:0 26px; border-radius:24px; color:var(--ink);
  background:color-mix(in srgb, var(--bg) 62%, transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.7); backdrop-filter:blur(22px) saturate(1.7);
  box-shadow:0 0 0 .5px var(--line), 0 8px 28px rgba(0,0,0,.22);
  display:inline-flex; align-items:center; gap:8px;
}
.sfoot .pill svg{width:18px; height:18px}
.sfoot .pill:active{transform:scale(.94)}
@keyframes flash{0%,100%{box-shadow:0 0 0 3px var(--ink)} 25%,75%{box-shadow:0 0 0 7px var(--ink)} 50%{box-shadow:0 0 0 3px var(--ink)}}
.cell.flash{animation:flash .9s ease 1}
.still [class*="a-"]{animation:none !important}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cell{filter:brightness(.9)} }
@media (max-height:700px){ .grid.v .cell svg{max-width:48px} .grid.v .cell .g{display:none} .grid.v .cell{grid-template-rows:auto 18px} }

/* ---------- landscape phone: tile on the left, everything else on the right ---------- */
@media (orientation: landscape) and (max-height: 560px){
  main{max-width:none; padding:10px 28px 0; column-gap:36px;
    grid-template-columns:auto minmax(0,1fr); grid-template-rows:48px minmax(0,1fr) auto 50px}
  .top{grid-column:2; grid-row:1}
  .day{display:contents}
  .cart{grid-column:1; grid-row:1 / -1; align-self:center; justify-self:center;
    width:auto; height:min(calc(100cqh - 20px), 44cqw); max-width:none}
  .day .txt{grid-column:2; grid-row:2; align-self:center; justify-items:start; text-align:left}
  .sign{--fs:clamp(30px, 14cqh, 58px)}
  .reading{height:auto}
  .month{grid-column:2; grid-row:3; padding-top:10px; row-gap:8px}
  nav{grid-column:2; grid-row:4}
  .sheet{max-width:640px}
  .grid.v{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} .cart .band{stroke-dashoffset:0} .cart .corner,.cart .dot{transform:none} .cart .fig{opacity:1} }
</style>

<body data-dir="0">
<main>
  <header class="top">
    <label class="gdate"><span id="gdate"></span><input id="picker" type="date" aria-label="Tria una data"></label>
    <button class="round" id="calBtn" aria-label="Obre el calendari"><svg viewBox="0 0 24 24" aria-hidden="true" ><path d="M4.5 7.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2zM4.5 10h15M8.5 3.5v3.5M15.5 3.5v3.5M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </header>

  <section class="day" id="day" aria-live="polite">

    <div class="txt">
      <h1 class="sign" id="sign"></h1>
      <p class="reading" id="reading"></p>
    </div>
  </section>

  <button class="month" id="monthBtn">
    <span class="col"><span class="cap" id="monthCap">Veintena</span><span class="val" id="month"></span></span>
    <span class="col r"><span class="cap">Any</span><span class="val" id="year"></span></span>
    <span class="band" id="ticks" aria-hidden="true"></span>
  </button>

  <nav>

    <button class="pill hide" id="today">Avui</button>
    <button class="round" id="next" aria-label="Dia següent"><svg viewBox="0 0 24 24" aria-hidden="true" ><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </nav>
</main>

<div class="dim" id="dim" hidden></div>
<div class="sheet" id="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>

<script>
// ===== MexCal engine (shared by web app and widget) =====
const SIGNS = [
  ["Cipactli","cocodril"],["Ehécatl","vent"],["Calli","casa"],["Cuetzpalin","sargantana"],
  ["Cóatl","serp"],["Miquiztli","mort"],["Mázatl","cérvol"],["Tochtli","conill"],
  ["Atl","aigua"],["Itzcuintli","gos"],["Ozomatli","mona"],["Malinalli","herba"],
  ["Ácatl","canya"],["Océlotl","jaguar"],["Cuauhtli","àguila"],["Cozcacuauhtli","voltor"],
  ["Ollin","moviment"],["Técpatl","sílex"],["Quiáhuitl","pluja"],["Xóchitl","flor"]];
const NUMS = ["Ce","Ome","Yei","Nahui","Macuilli","Chicuace","Chicome","Chicuei","Chiconahui",
  "Matlactli","Matlactlionce","Matlactliomome","Matlactliomei"];
const VEINTENAS = ["Atlcahualo","Tlacaxipehualiztli","Tozoztontli","Huey Tozoztli","Tóxcatl",
  "Etzalcualiztli","Tecuilhuitontli","Huey Tecuílhuitl","Tlaxochimaco","Xocotlhuetzi",
  "Ochpaniztli","Teotleco","Tepeílhuitl","Quecholli","Panquetzaliztli","Atemoztli","Títitl","Izcalli"];
const DIRS = ["orient","nord","ponent","sud"];
const BEARERS = ["Ácatl","Técpatl","Calli","Tochtli"];
// Anchor of the 260-day count. This one reproduces your 2023 table (12 Mar 2023 = 13 Cipactli).
// The Caso correlation (most cited by scholars) would be: { y:2023, m:3, d:12, num:6, sign:12 }.
const ANCHOR = { y:2023, m:3, d:12, num:13, sign:0 };
const NEW_YEAR = { m:3, d:12 };            // contemporary Mexica new year
const dayNum = (y,m,d) => Math.floor(Date.UTC(y,m-1,d)/864e5);
const mod = (a,n) => ((a%n)+n)%n;

function mexica(date){
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  const t = dayNum(y,m,d) - dayNum(ANCHOR.y,ANCHOR.m,ANCHOR.d);
  const num = mod(ANCHOR.num-1+t,13)+1, sign = mod(ANCHOR.sign+t,20);
  let sy = (m>NEW_YEAR.m || (m===NEW_YEAR.m && d>=NEW_YEAR.d)) ? y : y-1;
  const doy = dayNum(y,m,d) - dayNum(sy,NEW_YEAR.m,NEW_YEAR.d);
  const yearLen = dayNum(sy+1,NEW_YEAR.m,NEW_YEAR.d) - dayNum(sy,NEW_YEAR.m,NEW_YEAR.d);
  const nem = doy>=360;
  const k = sy-2023; // 2023 = 11 Ácatl
  return {
    num, numName:NUMS[num-1], sign, signName:SIGNS[sign][0], gloss:SIGNS[sign][1],
    dir:sign%4, dirName:DIRS[sign%4],
    month: nem ? "Nemontemi" : VEINTENAS[Math.floor(doy/20)], monthIdx: nem?18:Math.floor(doy/20),
    monthDay: nem ? doy-359 : doy%20+1, monthLen: nem ? yearLen-360 : 20,
    year: `${mod(10+k,13)+1} ${BEARERS[mod(k,4)]}`, trecenaDay:num
  };
}


// ===== 20 day-sign glyphs, drawn after the conventions of the Central Mexican codices =====
// Each draws in a 200×200 box. Classes: .a* = idle animation (see CSS).
const K="#2a1d17", RED="#B8322A", OCH="#D9A12B", TUR="#3E9C9A", BLU="#2F7FA8", WHT="#F8F2E4",
      GRN="#6F9A3E", PNK="#E59C82", BRN="#A8683E", DRK="#3b2f2a";
const eye=(x,y,r=9,o="")=>`<g class="a-blink" style="--o:${x}px ${y}px${o}"><circle cx="${x}" cy="${y}" r="${r}" fill="${WHT}"/><circle cx="${x+r*.25}" cy="${y}" r="${r*.45}" fill="${K}" class="ns"/></g>`;
const spiral=(x,y,s=1,c=K)=>`<path d="M${x},${y} c${8*s},0 ${12*s},${-8*s} ${6*s},${-13*s} c${-6*s},${-5*s} ${-16*s},${-2*s} ${-16*s},${8*s} c0,${12*s} ${16*s},${20*s} ${30*s},${12*s}" fill="none" stroke="${c}" stroke-width="5"/>`;
const teeth=(x0,x1,y,h=12,w=9)=>{let s="";for(let x=x0;x<x1;x+=w)s+=`<path d="M${x},${y} L${x+w/2},${y+h} L${x+w},${y}Z" fill="${WHT}" class="thin"/>`;return s;};
const collar=(y,c=OCH)=>`<path d="M48,${y} C70,${y+14} 120,${y+16} 150,${y+4} L154,${y+18} C120,${y+32} 70,${y+30} 44,${y+16}Z" fill="${c}"/>`+
  [62,80,98,116,134].map((x,i)=>`<circle cx="${x}" cy="${y+12+(i==0||i==4?-1:2)}" r="4" fill="${WHT}" class="thin"/>`).join("");

const GLYPHS = [
// 0 Cipactli — caiman head, no lower jaw, crest of spines
()=>`<g class="a-sway" style="--o:40px 120px;--a:2.5deg;--t:5s">
  ${[44,58,72,86,100,114].map((x,i)=>`<path d="M${x},${64-(i<3?i*2:6-i)} L${x+7},${38+Math.abs(i-2)*4} L${x+14},${62-(i<3?i*2:6-i)}Z" fill="${RED}"/>`).join("")}
  <path d="M28,122 C24,84 52,58 92,58 L152,66 C174,68 186,80 180,93 C176,101 164,103 152,101 L62,110 C48,114 40,128 28,122Z" fill="${GRN}"/>
  <path d="M60,84 C90,80 130,82 170,86" fill="none" class="thin"/>
  ${[0,1,2,3,4,5,6].map(i=>`<circle cx="${70+i*14}" cy="${74+i*.5}" r="3" fill="${OCH}" class="thin"/>`).join("")}
  <path d="M176,72 C188,60 196,74 186,80" fill="none" stroke-width="5"/>
  ${teeth(64,152,104,14,11)}
  <path d="M74,116 C78,146 112,150 124,124" fill="${RED}"/>
  <path d="M86,122 C92,136 108,136 114,124" fill="none" class="thin"/>
  <circle cx="48" cy="98" r="11" fill="${OCH}"/><circle cx="48" cy="98" r="4" fill="${K}" class="ns"/>
  <path d="M74,70 C82,60 104,62 108,72" fill="${RED}"/>
  ${eye(92,78,10)}
</g>`,
// 1 Ehécatl — wind god head with red beak mask, conical hat, wind volutes
()=>`${[0,1,2].map(i=>`<g class="a-drift" style="--dx:26px;--dy:${-14+i*14}px;--t:3.6s;animation-delay:${-i*1.2}s">${spiral(150,70+i*36,.9,TUR)}</g>`).join("")}
<g class="a-sway" style="--o:80px 150px;--a:2deg;--t:6s">
  <path d="M56,64 L88,8 L122,70Z" fill="${WHT}"/>
  ${[[82,34],[92,24],[96,46],[106,56],[78,54]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="${K}" class="ns"/>`).join("")}
  <path d="M50,66 C62,56 112,58 128,72" fill="none" stroke-width="7" stroke="${RED}"/>
  <path d="M68,66 C108,58 132,84 128,108 L124,132 C114,148 82,152 66,142 C48,126 44,82 68,66Z" fill="${DRK}"/>
  <path d="M98,80 C116,78 128,92 126,104 L104,104Z" fill="${OCH}" class="thin"/>
  <path d="M118,104 C140,92 172,98 182,112 C172,124 142,128 116,124Z" fill="${RED}"/>
  <path d="M122,114 C140,112 160,112 178,113" fill="none" class="thin"/>
  <circle cx="70" cy="108" r="12" fill="${WHT}"/><path d="M70,120 C72,132 62,140 56,134" fill="none" stroke="${WHT}" stroke-width="5"/>
  <circle cx="70" cy="108" r="4" fill="${K}" class="ns"/>
  ${eye(110,92,8)}
</g>`,
// 2 Calli — temple house on a platform, smoke rising
()=>`${[0,1].map(i=>`<g class="a-drift" style="--dx:${i?10:-8}px;--dy:-26px;--t:4s;animation-delay:${-i*2}s">${spiral(96+i*10,40,.7,"#8c7f75")}</g>`).join("")}
<rect x="34" y="150" width="132" height="22" fill="${OCH}"/>
<path d="M34,161 L166,161" class="thin"/>
${[48,70,92,114,136].map(x=>`<rect x="${x}" y="154" width="14" height="5" fill="${RED}" class="thin"/>`).join("")}
<rect x="52" y="98" width="96" height="52" fill="${WHT}"/>
<rect x="84" y="114" width="32" height="36" fill="${K}"/>
<path d="M84,114 L100,104 L116,114" fill="${OCH}" class="thin"/>
<rect x="52" y="98" width="96" height="9" fill="${TUR}"/>
<path d="M42,98 L158,98 L142,58 L58,58Z" fill="${RED}"/>
${[66,82,100,118,134].map(x=>`<circle cx="${x}" cy="78" r="5" fill="${WHT}" class="thin"/>`).join("")}
<path d="M58,58 L142,58" class="thin"/>
${[62,80,98,116,134].map(x=>`<path d="M${x},58 L${x},50 L${x+4},46 L${x+8},50 L${x+8},58Z" fill="${WHT}" class="thin"/>`).join("")}`,
// 3 Cuetzpalin — lizard seen from above, curling tail
()=>`<g class="a-sway" style="--o:100px 132px;--a:7deg;--t:3.4s">
  <path d="M96,132 C92,172 128,190 152,170 C168,156 156,136 140,146" fill="none" stroke="${K}" stroke-width="18"/>
  <path d="M96,132 C92,172 128,190 152,170 C168,156 156,136 140,146" fill="none" stroke="${TUR}" stroke-width="10"/>
  <path d="M100,150 C102,170 126,180 146,168" fill="none" stroke="${OCH}" stroke-width="3" stroke-dasharray="4 8"/>
</g>
<g class="a-sway" style="--o:100px 90px;--a:2deg;--t:3.4s">
  ${[[86,72,-1,-1],[114,72,1,-1],[88,118,-1,1],[112,118,1,1]].map(([x,y,sx,sy],i)=>`<g class="a-sway" style="--o:${x}px ${y}px;--a:${6*sx}deg;--t:3.4s;animation-delay:${-i*.4}s">
    <path d="M${x},${y} L${x+sx*28},${y+sy*-6} L${x+sx*36},${y+sy*14}" fill="none" stroke="${K}" stroke-width="11"/>
    <path d="M${x},${y} L${x+sx*28},${y+sy*-6} L${x+sx*36},${y+sy*14}" fill="none" stroke="${GRN}" stroke-width="5"/>
    ${[-8,0,8].map(d=>`<path d="M${x+sx*36},${y+sy*14} l${sx*6+d*.4},${sy*8+d*.2}" stroke-width="3"/>`).join("")}</g>`).join("")}
  <path d="M100,26 C116,26 122,46 115,60 C126,80 126,110 113,136 L87,136 C74,110 74,80 85,60 C78,46 84,26 100,26Z" fill="${GRN}"/>
  <path d="M86,60 C95,64 105,64 114,60" fill="none" class="thin"/>
  ${[74,90,106,122].map((y,i)=>`<path d="M${100-6+i},${y} L100,${y-7} L${106-i},${y} L100,${y+7}Z" fill="${OCH}" class="thin"/>`).join("")}
  <circle cx="92" cy="40" r="4.5" fill="${WHT}" class="thin"/><circle cx="108" cy="40" r="4.5" fill="${WHT}" class="thin"/>
  <circle cx="92" cy="40" r="2" fill="${K}" class="ns"/><circle cx="108" cy="40" r="2" fill="${K}" class="ns"/>
</g>`,
// 4 Cóatl — coiled serpent, banded, forked tongue
()=>`<g class="a-sway" style="--o:100px 170px;--a:3deg;--t:4.2s">
  <path id="cb" d="M44,168 C14,132 62,100 100,122 C140,144 176,112 154,80 C140,60 116,62 108,74" fill="none" stroke="${K}" stroke-width="28"/>
  <path d="M44,168 C14,132 62,100 100,122 C140,144 176,112 154,80 C140,60 116,62 108,74" fill="none" stroke="${OCH}" stroke-width="19"/>
  <path d="M44,168 C14,132 62,100 100,122 C140,144 176,112 154,80 C140,60 116,62 108,74" fill="none" stroke="${RED}" stroke-width="19" stroke-dasharray="9 15"/>
  <path d="M44,168 C14,132 62,100 100,122 C140,144 176,112 154,80 C140,60 116,62 108,74" fill="none" stroke="${WHT}" stroke-width="3" stroke-dasharray="2 22" stroke-dashoffset="-11"/>
  ${[0,1,2].map(i=>`<ellipse cx="${46-i*4}" cy="${172+i*7}" rx="9" ry="4" fill="${WHT}" class="thin"/>`).join("")}
  <g class="a-flick" style="--o:70px 60px;--t:2.6s"><path d="M70,60 L44,52 L34,44 M44,52 L34,58" fill="none" stroke="${RED}" stroke-width="4.5"/></g>
  <path d="M122,66 C116,44 88,38 72,50 C64,58 70,72 88,76 C104,80 122,78 122,66Z" fill="${OCH}"/>
  <path d="M72,58 C86,62 104,64 120,62" fill="none" class="thin"/>
  <path d="M86,40 C92,30 108,32 112,42" fill="${RED}" class="thin"/>
  ${eye(96,52,7)}
  <circle cx="76" cy="54" r="1.8" fill="${K}" class="ns"/>
</g>`,
// 5 Miquiztli — skull seen from the front, star eyes, curly hair, chattering jaw
()=>`${[[62,40,-1],[100,26,1],[138,40,1]].map(([x,y,s])=>`<path d="M${x},${y+14} C${x-10*s},${y} ${x+2*s},${y-12} ${x+10*s},${y-4} C${x+14*s},${y+2} ${x+6*s},${y+8} ${x+2*s},${y+3}" fill="none" stroke-width="7"/>`).join("")}
<path d="M48,96 C44,52 72,32 100,32 C128,32 156,52 152,96 C150,112 142,120 136,124 L134,142 L66,142 L64,124 C58,120 50,112 48,96Z" fill="${WHT}"/>
<path d="M100,34 C96,48 104,56 100,66 M70,52 C78,58 76,66 82,70" fill="none" class="thin"/>
<path d="M58,108 C62,118 70,122 78,120 M142,108 C138,118 130,122 122,120" fill="none" class="thin"/>
${[[78,90],[122,90]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="18" fill="${K}"/><g class="a-pulse" style="--o:${x}px ${y}px;animation-delay:${-i*1.5}s"><path d="M${x},${y-11} L${x+3},${y-3} L${x+11},${y} L${x+3},${y+3} L${x},${y+11} L${x-3},${y+3} L${x-11},${y} L${x-3},${y-3}Z" fill="${OCH}" class="ns"/><circle cx="${x}" cy="${y}" r="4" fill="${WHT}" class="ns"/></g>`).join("")}
<path d="M100,104 C108,110 108,120 100,124 C92,120 92,110 100,104Z" fill="${K}"/>
${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${70+i*7.5}" y="124" width="7.5" height="16" rx="1.5" fill="${WHT}" class="thin"/>`).join("")}
<g class="a-chatter" style="--o:70px 142px">
  <path d="M66,142 L134,142 L130,160 C118,172 82,172 70,160Z" fill="${WHT}"/>
  ${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${70+i*7.5}" y="142" width="7.5" height="11" rx="1.5" fill="${WHT}" class="thin"/>`).join("")}
</g>
${[44,156].map(x=>`<circle cx="${x}" cy="104" r="10" fill="${RED}"/><circle cx="${x}" cy="104" r="4" fill="${WHT}" class="thin"/><path d="M${x},114 L${x-4},130 L${x+4},130Z" fill="${OCH}" class="thin"/>`).join("")}`,
// 6 Mázatl — deer with a long raised neck and wide antlers
()=>`<g transform="translate(9 14) scale(.9)"><g class="a-sway" style="--o:100px 190px;--a:3deg;--t:5.5s">
  <path d="M70,192 C78,152 86,122 94,98 L128,100 C122,130 120,162 126,192Z" fill="${BRN}"/>
  <path d="M100,108 C98,134 100,162 104,190" fill="none" stroke="${WHT}" stroke-width="7" opacity=".85"/>
  ${[[86,150],[114,128],[90,176]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="${WHT}" class="thin"/>`).join("")}
  <g class="a-sway" style="--o:110px 96px;--a:4deg;--t:3.7s">
    <path d="M108,70 C100,46 84,32 62,26 M92,44 C92,34 90,26 84,16 M78,34 C74,26 72,20 70,10 M114,68 C118,42 132,28 152,20 M126,42 C128,32 126,24 122,14 M140,28 C144,22 146,16 146,6" fill="none" stroke="${K}" stroke-width="10"/>
    <path d="M108,70 C100,46 84,32 62,26 M92,44 C92,34 90,26 84,16 M78,34 C74,26 72,20 70,10 M114,68 C118,42 132,28 152,20 M126,42 C128,32 126,24 122,14 M140,28 C144,22 146,16 146,6" fill="none" stroke="${WHT}" stroke-width="4"/>
    <g class="a-twitch" style="--o:102px 76px;--a:-14deg;--t:4.4s">

function fitSign(){

function render(){
  const r = mexica(cur);

  const bg = getComputedStyle(document.documentElement).getPropertyValue(themeVars[r.dir]).trim();
  document.documentElement.style.backgroundColor = bg;
  document.querySelector('meta[name="theme-color"]').content = bg;
  $("gdate").textContent = cap(fmt.format(cur));

  $("monthCap").textContent = r.month === "Nemontemi" ? "Dies sense nom" : "Veintena";
  $("month").innerHTML = `<b>${r.month}</b>dia ${r.monthDay} de ${r.monthLen}`;

    `<span class="${i+1<r.monthDay?'past':i+1===r.monthDay?'now':''}"></span>`).join("");

(()=>{ const unanim = s => s.replace(/class="([^"]*)"/g,(m,c)=>`class="${c.replace(/\ba-[a-z]+\b/g,"").trim()}"`).replace(/id="flint"/,'id="flint-s"').replace(/url\(#flint\)/,"url(#flint-s)");

const tile = sign => `<svg viewBox="0 0 200 200" aria-hidden="true"><use href="#gs${sign}"/></svg>`;

const periodLen = s => view==="v" ? mexica(s).monthLen : new Date(s.getFullYear(), s.getMonth()+1, 0).getDate();
const nextStart = s => view==="v" ? addDays(s, periodLen(s)) : new Date(s.getFullYear(), s.getMonth()+1, 1, 12);
const prevStart = s => view==="v" ? veintenaStart(addDays(s,-1)) : new Date(s.getFullYear(), s.getMonth()-1, 1, 12);
let first=null, last=null, loading=false;

function periodHTML(s){
  const today=noon(new Date()), len=periodLen(s), end=addDays(s,len-1), isNow = today>=s && today<=end;
  let head, cells="";
  if (view==="v"){
    const sameY = s.getFullYear()===end.getFullYear();
    const range = sameY ? `del ${longD.format(s)} al ${longD.format(end)} del ${end.getFullYear()}`
                        : `del ${longD.format(s)} del ${s.getFullYear()} al ${longD.format(end)} del ${end.getFullYear()}`;
    head=`<h3>${mexica(s).month} <span>${mexica(s).year}</span></h3><p>${range}</p>`;
  } else {
    const r0=mexica(s), r1=mexica(end), m=cap(new Intl.DateTimeFormat("ca-ES",{month:"long"}).format(s));
    head=`<h3>${m} <span>${s.getFullYear()}</span></h3><p>${r0.month===r1.month ? r0.month : `${r0.month} i ${r1.month}`}</p>`;
    for(let i=0;i<(s.getDay()+6)%7;i++) cells+=`<span class="cell blank"></span>`;
  }
  for(let i=0;i<len;i++){
    const d=addDays(s,i), r=mexica(d);

    cells += view==="v"
      ? `<button class="${cls}" data-d="${iso(d)}" aria-label="${r.num} ${r.signName}, ${longD.format(d)}">${tile(r.sign)}<span class="num">${r.num}</span><span class="n" style="${r.signName.length>11?"font-size:10.5px;letter-spacing:-.03em":""}">${r.signName}</span><span class="g">${shortD.format(d)}</span></button>`

/* ---------- iOS home-screen bug: the page is given a viewport shorter than the screen by the
   status-bar height, while still being drawn from under the status bar. Measure the missing
   strip and extend the fixed layers over it (only in the installed app, only if it's small). ---------- */
function fixViewport(){
  const standalone = navigator.standalone===true || matchMedia("(display-mode: standalone)").matches;
  const portrait = innerHeight > innerWidth;
  const screenH = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
  const missing = screenH - innerHeight;
  const fix = standalone && missing > 0 && missing <= 64 ? missing : 0;
  // measured for the diagnostics only: extending the layers didn't help, iOS clips drawing at the viewport edge
  document.documentElement.style.setProperty("--vfix", "0px");
  vfixInfo = `${innerHeight} of ${screenH}, ${standalone?"app":"browser"}`;
  return fix;
}
// iOS settles the viewport size late and doesn't always fire "resize" when it does,
// so measure again at every moment it could have changed
let vfixInfo = "";
const refit = ()=>{ fixViewport(); fitSign(); };
fixViewport();
["resize","load","pageshow","orientationchange"].forEach(ev=>addEventListener(ev, ()=>{ refit(); setTimeout(refit, 350); }));
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ refit(); setTimeout(refit, 350); } });
if (window.visualViewport) visualViewport.addEventListener("resize", refit);
[50, 300, 1000, 2500].forEach(ms=>setTimeout(refit, ms));

/* ---------- layout diagnostics: tap the sign name 3 times quickly to show/hide ---------- */
(()=>{ let taps=[], box=null;
  const probe=document.createElement("div");
  probe.style.cssText="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)";
  document.body.appendChild(probe);
  const fill=()=>{ if(!box) return; fixViewport(); const cs=getComputedStyle(probe), r=id=>$(id).getBoundingClientRect();
    const rows=[["standalone", navigator.standalone===true || matchMedia("(display-mode: standalone)").matches],
      ["screen", screen.width+"x"+screen.height], ["innerHeight", innerHeight], ["visualViewport", window.visualViewport?Math.round(visualViewport.height):"-"],
      ["html.clientHeight", document.documentElement.clientHeight], ["body bottom", Math.round(document.body.getBoundingClientRect().bottom)],
      ["safe top/bottom", parseFloat(cs.paddingTop)+" / "+parseFloat(cs.paddingBottom)],
      ["arrow bottom", Math.round(r("next").bottom)], ["gap under arrow", Math.round(innerHeight - r("next").bottom)],
      ["viewport fix", getComputedStyle(document.documentElement).getPropertyValue("--vfix")],
      ["gap to real screen bottom", Math.round((navigator.standalone===true||matchMedia("(display-mode: standalone)").matches ? (innerHeight>innerWidth?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width)) : innerHeight) - r("next").bottom)],
      ["measured", vfixInfo],
      ["version", "layout-6"]];
    box.innerHTML = rows.map(([k,v])=>"<div><b>"+k+"</b> "+v+"</div>").join(""); };
  $("sign").addEventListener("click", ()=>{ const now=Date.now(); taps=taps.filter(t=>now-t<700); taps.push(now);
    if (taps.length<3) return; taps=[];
    if (box){ box.remove(); box=null; return; }
    box=document.createElement("div");
    box.style.cssText="position:fixed;z-index:50;left:12px;top:calc(env(safe-area-inset-top,0px) + 8px);padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.78);color:#fff;font:12px/1.5 ui-monospace,Menlo,monospace";
    document.body.appendChild(box); fill(); });
  addEventListener("resize", fill);
})();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
document.fonts && document.fonts.ready.then(fitSign);
render();
</script>
</body>
</html>
